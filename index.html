<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>હેપીના જવારા પ્રસંગે હાર્દિક આમંત્રણ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Noto Sans Gujarati',sans-serif;color:#5d281d;background:radial-gradient(circle at 50% 20%,#fff9e8,#f7d7a7 65%,#eab77c);overflow-x:hidden}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px}.card{width:min(560px,100%);text-align:center;padding:34px 24px 38px;border:2px solid #d9a34c;border-radius:28px;background:rgba(255,250,235,.9);box-shadow:0 18px 55px #8b4b2633;position:relative;overflow:hidden}.mandala{font-size:42px;color:#b77a25}.eyebrow{letter-spacing:2px;color:#9a5b2a;font-size:14px}.title{font-size:clamp(32px,8vw,54px);font-weight:800;color:#9b301f;margin:10px 0}.sub{font-size:20px;line-height:1.8}.date{display:inline-block;margin:18px 0;padding:12px 22px;border-radius:50px;background:#8d281c;color:#fff7df;font-weight:700}.btn{display:inline-block;background:linear-gradient(135deg,#a52e20,#d98b2c);color:#fff;text-decoration:none;padding:15px 28px;border-radius:50px;font-size:18px;font-weight:700;box-shadow:0 8px 20px #a52e2044;animation:pulse 2s infinite}.small{font-size:13px;color:#8d6847;margin-top:22px}@keyframes pulse{50%{transform:scale(1.04)}}.petal{position:fixed;top:-30px;z-index:5;pointer-events:none;animation:fall linear forwards;filter:drop-shadow(0 2px 2px #8b3b2b33)}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg)}}
</style></head><body><main class="wrap"><section class="card"><div class="mandala">❀ ॐ ❀</div><div class="eyebrow">જય માતાજી 🙏</div><h1 class="title">કુ. ચિ. હેપી</h1><div class="sub">ના પવિત્ર <b>જવારા પ્રસંગે</b><br>આપ સહકુટુંબ પધારી પ્રસંગની શોભા વધારશો.</div><div class="date">🌼 ૧૬ એપ્રિલ ૨૦૨૭ · સવારે ૮:૦૦ વાગ્યે 🌼</div><p class="sub">📍 ખેડાસા, ગુજરાત</p><a class="btn" href="invitation.html">💌 આમંત્રણ ખોલો</a><div class="small">સ્નેહભર્યું આમંત્રણ · પરમાર પરિવાર, ખેડાસા</div></section></main><script>
const petals=['🌸','🌺','🌼','🌷','💮','🌻'];function shower(){for(let i=0;i<18;i++){let p=document.createElement('span');p.className='petal';p.textContent=petals[Math.floor(Math.random()*petals.length)];p.style.left=Math.random()*100+'vw';p.style.fontSize=(15+Math.random()*19)+'px';p.style.animationDuration=(5+Math.random()*7)+'s';p.style.setProperty('--drift',(Math.random()*220-110)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),13000)}}shower();setInterval(shower,900);
</script></body></html>
